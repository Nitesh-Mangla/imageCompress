<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Image Compressor</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <style>
    body {
      background: linear-gradient(to right, #ff758c, #ff7eb3);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 600px;
    }

    .card {
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      animation: fadeIn 0.8s ease-in-out;
      max-height: 67rem;
      overflow: scroll;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #drop-area {
      border: 2px dashed #6c63ff;
      border-radius: 12px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease-in-out;
      text-align: center;
      cursor: pointer;
    }

    #drop-area.highlight {
      border-color: #4caf50;
      background: rgba(108, 99, 255, 0.2);
      box-shadow: 0 0 20px #4caf50;
    }

    .btn-custom {
      background-color: #6c63ff;
      color: #fff;
      border-radius: 12px;
      padding: 12px 24px;
      transition: all 0.3s ease-in-out;
    }

    .btn-custom:hover {
      background-color: #5448d8;
      box-shadow: 0 0 12px rgba(108, 99, 255, 0.8);
    }

    .image-preview {
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
      transition: transform 0.3s ease-in-out;
    }

    .image-preview:hover {
      transform: scale(1.02);
    }

    .hidden {
      display: none;
    }

    #compressed-container {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    #downloadBtn {
      transition: transform 0.3s ease-in-out;
    }

    #downloadBtn:hover {
      transform: scale(1.1);
    }

    .form-control {
      border-radius: 12px;
    }

    .progress {
      margin-top: 15px;
    }

    .compresed-container{
      margin-top: 6%;
    }

    .input-field{
      margin-bottom: 5%;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card text-center">
    <h3 class="mb-4 text-primary"><i class="fas fa-compress-arrows-alt"></i> Advanced Image Compressor</h3>

    <!-- Drag & Drop Area -->
    <div id="drop-area" class="mb-4">
      <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-2"></i>
      <p>Drag & Drop an image or <span class="text-primary">click to upload</span></p>
      <input type="file" id="fileInput" class="hidden" />
    </div>

    <!-- Image Preview -->
    <div id="preview-container" class="hidden">
      <h5 class="text-success">Original Image</h5>
      <img id="originalImage" class="image-preview" />
      <div class="mt-3 form-group compresed-container">
        <label for="quality" class="form-label">Compression Quality (%)</label>
        <input type="range" class="form-range" id="quality" min="10" max="100" value="80">
        <p>Quality: <span id="qualityValue">80</span>%</p>

        <div class="row">
          <div class="input-field">
            <input type="number" class="form-control" id="width" placeholder="Width (px)" />
          </div>
          <div class="input-field">
            <input type="number" class="form-control" id="height" placeholder="Height (px)" />
          </div>
          <div class="input-field">
            <input type="number" class="form-control" id="pixel" placeholder="Enter Pixel Density" />
          </div>
        </div>

        <!-- Pixel Change Option -->


        <!-- Progress Bar -->
        <div class="progress mt-3">
          <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <button class="btn btn-custom mt-4" onclick="compressImage()">
          <i class="fas fa-compress"></i> Compress Image
        </button>
      </div>
    </div>

    <!-- Compressed Image Container -->
    <div id="compressed-container" class="mt-4 hidden fade-in">
      <h5 class="text-primary"><i class="fas fa-image"></i> Compressed Image</h5>
      <img id="compressedImage" class="image-preview" />
      <a id="downloadBtn" class="btn btn-success mt-3" download="compressed-image.jpg">
        <i class="fas fa-download"></i> Download Compressed Image
      </a>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
<!-- Font Awesome for Icons -->
<script src="https://kit.fontawesome.com/a076d05399.js"></script>

<script>
  let originalFile;

  // Drag & Drop Functionality
  const dropArea = document.getElementById('drop-area');

  dropArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropArea.classList.add('highlight');
  });

  dropArea.addEventListener('dragleave', () => {
    dropArea.classList.remove('highlight');
  });

  dropArea.addEventListener('drop', (e) => {
    e.preventDefault();
    dropArea.classList.remove('highlight');
    const file = e.dataTransfer.files[0];
    handleFile(file);
  });

  dropArea.addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', (e) => {
    handleFile(e.target.files[0]);
  });

  async function handleFile(file) {
    if (!file) {
      alert('Invalid file! Please upload a valid image.');
      return;
    }
    originalFile = file;
    previewImage(file);
  }

  function previewImage(file) {
    const reader = new FileReader();
    reader.onload = function (e) {
      document.getElementById('originalImage').src = e.target.result;
      document.getElementById('preview-container').classList.remove('hidden');
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('quality').addEventListener('input', (e) => {
    document.getElementById('qualityValue').innerText = e.target.value;
  });

  async function compressImage() {
    document.getElementById('progress-bar').style.width = 0;
    if (!originalFile) {
      alert('Please upload an image first.');
      return;
    }

    const quality = parseInt(document.getElementById('quality').value) / 100;
    const width = parseInt(document.getElementById('width').value) || null;
    const height = parseInt(document.getElementById('height').value) || null;
    const pixelDensity = parseInt(document.getElementById('pixel').value) || 1;

    const formData = new FormData();
    formData.append('file', originalFile);
    if(quality){
      formData.append('quality', quality);
    }
    if(width){
      formData.append('width', width);
    }
    if(height){
      formData.append('height', height);
    }

    if(pixelDensity){
      formData.append('pixelDensity', pixelDensity);
    }
    const response = await fetch('http://localhost:3031/compress', {
      method: 'POST',
      body: formData,
    });

    if (!response.ok) {
      const res = await response.body;
      console.log(res)
      alert('Compression failed. Please try again.');
      return;
    }
    let progress = 0;
    const interval = setInterval(() => {
      progress += 10;
      document.getElementById('progress-bar').style.width = `${progress}%`;
      if (progress >= 100) {
        clearInterval(interval);
      }
    }, 100);
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    if(url){
      document.getElementById('compressed-container').classList.remove('hidden');
      document.getElementById('downloadBtn').href = url;
    }

  }
</script>
</body>

</html>
